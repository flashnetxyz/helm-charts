replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

command:
  enabled: true
  data:
    - "/bin/sh"
    - "-c"
    - "/app/flashnet-validator"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 50059

config:
  grpcBindAddress: "0.0.0.0:50059"
  signingKey: []
  runningAuthority: "<YOUR_RUNNING_AUTHORITY>"
  teeCryptoModulePublicKey: []
  validatorId: []  # Validator UUIDs from database registry (comma-separated in env)
  databaseUrl: []  # PostgreSQL connection URLs (one per validator)

env:
  - name: RUST_LOG
    value: "info"

metrics:
  datadog:
    enabled: true
    env: production
