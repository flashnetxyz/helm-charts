replicaCount: 1

image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: "latest"

command:
  enabled: true
  data:
    - "/bin/sh"
    - "-c"
    - "/app/flashnet-validator"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 50059

ingress:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Signature,Account-Id"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
  hosts:
    - host: <YOUR_NAME>
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: settlement-validator-tls
     hosts:
       - <YOUR_NAME>

config:
  grpcBindAddress: "0.0.0.0:50059"
  signingKey: []
  runningAuthority: "<YOUR_RUNNING_AUTHORITY>"
  teeCryptoModulePublicKey: []
  validatorId: []  # Validator UUIDs from database registry (comma-separated in env)
  databaseUrl: []  # PostgreSQL connection URLs (one per validator)

env:
  - name: RUST_LOG
    value: "info"

metrics:
  datadog:
    enabled: true
    env: production
